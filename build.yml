name: Build BOOM miniapp Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Build standalone folder
        run: python build_standalone.py
      - name: Upload ready-to-run folder
        uses: actions/upload-artifact@v6
        with:
          name: BOOM-miniapp-Windows-x64
          path: build/netshort_studio.dist/
          if-no-files-found: error
          retention-days: 14
