name: Build and release BOOM miniapp
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: boom-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: Build standalone folder
        run: python build_standalone.py
      - name: Create signed BOOM update
        env:
          BOOM_SIGNING_KEY_XML: ${{ secrets.BOOM_SIGNING_KEY_XML }}
        run: python make_github_release.py
      - name: Build Inno Setup installer
        run: python build_installer.py
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: BOOM-miniapp-Setup
          path: release-assets/BOOM-miniapp-Setup-*.exe
          if-no-files-found: error
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BOOM-miniapp-Windows-x64
          path: build/netshort_studio.dist/
          if-no-files-found: error
      - name: Publish completed GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionBoom = python -c "from boom_update_core import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read BOOM version' }
          $tagBoom = "v$versionBoom"
          $setupBoom = "release-assets/BOOM-miniapp-Setup-$versionBoom.exe"
          if (!(Test-Path -LiteralPath $setupBoom)) { throw "Missing installer" }
          gh release create $tagBoom release-assets/BOOM-miniapp-update.zip release-assets/boom-manifest.json $setupBoom --target $env:GITHUB_SHA --title "BOOM miniapp $tagBoom" --notes "Automatic signed BOOM release $tagBoom" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release exists or creation failed. Inspect draft release before retry.' }
          gh release edit $tagBoom --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
